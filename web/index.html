<title>Cortex 大脑</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* layout: compact 3D scan hero (left) beside the chat (right); the layer map with its connections runs full width below */
:root{
  --bg:#0b0d12; --panel:#12151c; --line:#232936; --fg:#e6e8ee; --mute:#8a90a0; --inset:#0a0d13;
  --warn:#e8c26a; --accent:#4cc3d9; --you:#1c2433;
  --display:'Fraunces',Georgia,serif; --body:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#eef0f4;--panel:#fff;--line:#d5d9e2;--fg:#161a22;--mute:#5d6578;--inset:#f3f5f9;--warn:#946a08;--accent:#0e7a92;--you:#e3e9f4;color-scheme:light}}
:root[data-theme="light"]{--bg:#eef0f4;--panel:#fff;--line:#d5d9e2;--fg:#161a22;--mute:#5d6578;--inset:#f3f5f9;--warn:#946a08;--accent:#0e7a92;--you:#e3e9f4;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px}
button,select,textarea{font:inherit;color:var(--fg)}
button,select{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 12px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:12px;height:420px;margin-bottom:12px}
.scan{position:relative;border:1px solid #1b2433;border-radius:12px;overflow:hidden;background:radial-gradient(90% 80% at 50% 55%,#06222e 0%,#02090f 72%);min-width:0}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.scan h1{position:absolute;left:14px;top:10px;margin:0;font:500 22px/1.1 var(--display);color:#e6e8ee;letter-spacing:-.01em;pointer-events:none}
.scan .mdl{position:absolute;left:14px;top:38px;font:11px var(--mono);color:#6fa8bd;pointer-events:none;max-width:70%}
#hud{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.scan .meta{position:absolute;left:14px;bottom:10px;right:14px;display:flex;justify-content:space-between;gap:8px;font:11px var(--mono);color:#7d8aa3;pointer-events:none}
.scan .meta b{color:#e8c26a;font-weight:400}
.bar{position:absolute;right:14px;top:12px;width:10px;bottom:36px;border-radius:5px;background:linear-gradient(#ff3a2c,#f9e12c,#58dc58,#08c8dc,#1e3cc8);opacity:.9}
.bar i{position:absolute;right:16px;font:10px var(--mono);color:#7d8aa3;font-style:normal}
.chat{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.chead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.chead select{min-width:0;max-width:100%}
.badge{font:11px var(--mono);padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.badge.live{color:#58dc58;border-color:#58dc58}
.badge.demo{color:var(--warn);border-color:var(--warn)}
.sp{flex:1}
#msgs{flex:1;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.m{max-width:92%;padding:8px 12px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.m.u{align-self:flex-end;background:var(--you)}
.m.a{align-self:flex-start;border:1px solid var(--line)}
.m pre{margin:6px 0;padding:8px 10px;background:var(--inset);border-radius:6px;overflow-x:auto;font:12px/1.5 var(--mono);white-space:pre}
.m.sys{align-self:center;color:var(--mute);font-size:12px;border:0;text-align:center}
form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
textarea{flex:1;min-width:0;resize:none;height:44px;background:var(--inset);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
#send{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.net{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0;padding-top:10px;overflow:hidden}
.nh{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between;align-items:center;padding:0 12px 8px;font-size:12px;color:var(--mute)}
.nh b{color:var(--fg);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0;border-right:1px solid var(--line);padding:4px 11px}
.seg button:last-child{border-right:0}
.nw{display:flex;min-width:0}
.gut{flex:none;width:84px;position:relative;font:11px var(--mono);color:var(--mute)}
.gut span{position:absolute;left:12px}
.scroller{overflow-x:auto;min-width:0;flex:1;padding-bottom:6px;background:var(--inset)}
#net{display:block}
.key{display:flex;flex-wrap:wrap;gap:6px 16px;padding:8px 12px 12px;font-size:12px;color:var(--mute);border-top:1px solid var(--line)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.grad{display:inline-block;width:90px;height:8px;border-radius:2px;margin:0 6px;vertical-align:0;background:linear-gradient(90deg,#1e3cc8,#08c8dc,#58dc58,#f9e12c,#ff3a2c)}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--panel);border:1px solid var(--fg);border-radius:7px;padding:7px 10px;font:12px/1.5 var(--mono);color:var(--fg);max-width:310px;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.ov{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.ov[hidden]{display:none}
.mod{width:min(780px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.mh b{font:500 18px var(--display)}
#mbody{padding:14px 16px 18px;display:flex;flex-direction:column;gap:12px}
.hint{color:var(--mute);font-size:12px;margin:0}
.err{color:#ff7a66;font-size:12px}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--inset)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row .sp{flex:1}
.nm{font-weight:500}.rp{font:11px var(--mono);color:var(--mute);overflow-wrap:anywhere}
.pill{font:11px var(--mono);padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.pill.ok{color:#58dc58;border-color:#58dc58}.pill.act{color:var(--accent);border-color:var(--accent)}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,#08c8dc,#58dc58)}
input[type=text]{flex:1;min-width:180px;background:var(--inset);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--fg);font:inherit}
.btn1{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.steps{display:flex;gap:6px;flex-wrap:wrap}.steps span{font:11px var(--mono);padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}.steps span.on{color:var(--fg);border-color:var(--fg)}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--mute);cursor:pointer}
.drop.over{border-color:var(--accent);color:var(--fg)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.kv div{border:1px solid var(--line);border-radius:8px;padding:6px 10px}.kv small{display:block;color:var(--mute);font-size:11px}.kv b{font:500 16px var(--mono)}
pre.pv{margin:0;font:11px/1.4 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--mute)}
@media (max-width:860px){.hero{grid-template-columns:1fr;height:auto}.scan{height:300px}.chat{height:440px}}
</style>

<div class="hero">
  <div class="scan">
    <canvas id="gl" aria-label="三维全息神经网络，每一圈节点是一层，颜色表示该层的实时活动"></canvas>
    <h1>Cortex</h1>
    <div class="mdl" id="scanModel"></div>
    <canvas id="hud" aria-hidden="true"></canvas>
    <div class="bar"><i style="top:-3px">高</i><i style="bottom:-3px">低</i></div>
    <div class="meta"><span id="scanSig"></span><span id="scanTps"></span></div>
  </div>
  <section class="chat" aria-label="聊天">
    <div class="chead">
      <label for="model" class="badge" style="border:0;padding:0">模型</label>
      <select id="model" aria-label="选择模型"></select>
      <span class="badge" id="mode"></span>
      <select id="adapter" aria-label="适配器" hidden></select>
      <span class="sp"></span>
      <button id="btnLib" type="button">模型库</button>
      <button id="btnTrain" type="button">训练</button>
      <button id="btnWeb" type="button" aria-pressed="false" title="打开后，模型需要时会自己上网搜索并读网页（你的问题会发给搜索服务）">联网搜索</button>
      <button id="btnWebSet" type="button">搜索设置</button>
      <button id="clear" type="button">清空对话</button>
    </div>
    <div id="msgs" aria-live="polite"></div>
    <form id="form">
      <textarea id="inp" placeholder="问点什么，Enter 发送，Shift+Enter 换行" aria-label="消息"></textarea>
      <button id="send" type="submit">发送</button>
    </form>
  </section>
</div>

<div class="net">
  <div class="nh">
    <span><b>神经网络层</b> · <span id="nlayers">40</span> 层，层与层之间的连线随活动发光</span>
    <span class="seg" id="modes" role="group" aria-label="显示模式">
      <button data-m="infer" aria-pressed="true">推理</button>
      <button data-m="train" aria-pressed="false">训练</button>
      <button data-m="weights" aria-pressed="false">权重</button>
    </span>
    <button id="step" type="button">训练一步（示例）</button>
    <span id="dataNote"></span>
  </div>
  <div class="nw"><div class="gut" id="gut"></div><div class="scroller" id="scroller"><canvas id="net"></canvas></div></div>
  <div class="key" id="key"></div>
</div>
<div id="tip" hidden></div>
<div class="ov" id="ov" hidden><div class="mod" role="dialog" aria-modal="true" aria-labelledby="mtitle">
  <div class="mh"><b id="mtitle"></b><button id="mclose" type="button">关闭</button></div><div id="mbody"></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const MONO="12px 'IBM Plex Mono',ui-monospace,monospace";
let NL=40, G=12;
const KNOWN={ // 来自 cortex models inspect 的实测结构；L=线性注意力层，A=全注意力层
  'devstral-small-2':{n:40,pat:'A'.repeat(40),label:'Devstral Small 2 · 40 层 · 全部为标准注意力'},
  'qwen3.6-27b':{n:64,pat:'LLLA'.repeat(16),label:'Qwen3.6-27B · 64 层 = 16 ×（3 线性注意力 + 1 全注意力）'}};
let PAT=KNOWN['devstral-small-2'].pat;
const MATS=[
  {name:'self_attn.q_proj',label:'注意力 Q',shape:[4096,5120]},
  {name:'self_attn.o_proj',label:'注意力 输出',shape:[5120,4096]},
  {name:'mlp.gate_proj',label:'MLP 门控',shape:[32768,5120]},
  {name:'mlp.down_proj',label:'MLP 下投影',shape:[5120,32768]}];
const pick=(n,k)=>Math.round(k*(n-1)/(G-1));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)), sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
function rng(seed){let s=seed>>>0;return()=>((s=Math.imul(s^s>>>15,1|s)+0x6D2B79F5>>>0),((s^s>>>7)>>>0)/4294967296)}
// 医学扫描常用的热度色标：蓝 → 青 → 绿 → 黄 → 红
const STOPS=[[0,[30,60,200]],[.25,[8,200,220]],[.5,[88,220,88]],[.75,[249,225,44]],[1,[255,58,44]]];
function heat(e){e=clamp(e,0,1);for(let i=1;i<STOPS.length;i++){if(e<=STOPS[i][0]){const[a,ca]=STOPS[i-1],[b,cb]=STOPS[i],t=(e-a)/(b-a);return[ca[0]+(cb[0]-ca[0])*t,ca[1]+(cb[1]-ca[1])*t,ca[2]+(cb[2]-ca[2])*t]}}return STOPS[4][1]}

// ======== 运行状态 ========
let LIVE=false, SIM=true, active=null, busy=false;
let act=new Float32Array(NL);          // 平滑后的显示强度 0..1
let lo=new Float32Array(NL).fill(1e9), hi=new Float32Array(NL).fill(-1e9);
function pushEnergy(arr,simulated){    // 一个 token 的逐层活动 → 归一化到 0..1
  if(!arr||!arr.length)return;
  if(arr.length!==NL){ // 模型实际层数和界面当前层数不一致（例如切换模型后）：按真实层数重建
    resetLayers(arr.length);const k=active&&KNOWN[active];if(k&&k.n===arr.length){PAT=k.pat;buildHolo()}
    loadWeightsFor(active||'')}
  for(let l=0;l<NL;l++){const v=arr[l];
    if(simulated){act[l]=Math.max(act[l],clamp(v,0,1));continue}
    lo[l]=Math.min(lo[l]*.999+v*.001,v);hi[l]=Math.max(hi[l]*.999+v*.001,v);   // 每层的运行范围
    const e=(v-lo[l])/(hi[l]-lo[l]+1e-6);act[l]=Math.max(act[l],clamp(e,0,1))}
}
function resetLayers(n){NL=n;act=new Float32Array(NL);lo=new Float32Array(NL).fill(1e9);hi=new Float32Array(NL).fill(-1e9);
  dW=[...Array(NL)].map(()=>MATS.map(()=>new Float32Array(144)));dMax=1e-6;deltaReal=false;synth();$('nlayers').textContent=NL;buildNet();buildHolo()}
function setStructure(key,n){ // 切换模型时让立柱的层数与真实层数一致
  const K=KNOWN[key]||{n:40,pat:'A'.repeat(40),label:'演示后端 · 40 层'};const nn=n||K.n;
  PAT=nn===K.n?K.pat:'A'.repeat(nn);$('scanModel').textContent=nn===K.n?K.label:K.label.split(' · ')[0]+' · '+nn+' 层';
  resetLayers(nn);loadWeightsFor(key)}

// ======== 权重（真实采样优先） ========
let W=null,realWeights=false,dW=[],dMax=1e-6;
function synth(){const r=rng(7),gauss=()=>Math.sqrt(-2*Math.log(r()+1e-9))*Math.cos(6.2832*r());
  W=[];for(let l=0;l<NL;l++)W.push(MATS.map((m,k)=>{const sd=.012+.01*Math.sin(l/6+k)**2,v=new Float32Array(144);for(let i=0;i<144;i++)v[i]=gauss()*sd;return{v,std:sd,shape:m.shape}}));realWeights=false}
function loadWeights(j){W=j.layers.map(L=>L.m.map(m=>({v:Float32Array.from(m.v),std:m.std,shape:m.shape})));realWeights=true}
function noteData(){$('dataNote').innerHTML=realWeights?'权重值：<b>真实权重</b>':'权重值：<b style="color:var(--warn)">示例（运行 dump_weights.py 换成真实值）</b>'}
function trainStep(){ // 示例：等训练接入后换成适配器的真实 ΔW
  const r=Math.random;for(let l=0;l<NL;l++)for(let k=0;k<4;k++){const prof=(.3+.7*l/NL)*(k>=2?1:.6);
    for(let i=0;i<144;i++){dW[l][k][i]+=(r()-.45)*W[l][k].std*.08*prof*(r()<.35?1:0);dMax=Math.max(dMax,Math.abs(dW[l][k][i]))}}
  mode='train';setMode()
}

// ======== 3D 全息神经网络（原创：每层一圈节点；相邻层反向旋转；一圈 = 一层，和模型真实层数一致） ========
const cv=$('gl'),renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(38,1,.1,50);camera.position.set(0,.15,6.3);
const rig=new THREE.Group();scene.add(rig);
const ADD=THREE.AdditiveBlending,hud=$('hud'),hx=hud.getContext('2d');
let holo=null,H={},PER=36;
const Rl=(l,n)=>.36+.64*Math.pow(Math.sin(Math.PI*(l+.5)/n),.8), Yl=(l,n)=>-1.05+2.1*l/Math.max(1,n-1);
function mkLines(segs,color,op){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(segs),3));
  return new THREE.LineSegments(g,new THREE.LineBasicMaterial({color,transparent:true,opacity:op,blending:ADD,depthWrite:false}))}
function dashedRing(rad,dashes,color,op){const a=[];for(let i=0;i<dashes;i++){const t0=6.2832*i/dashes,t1=t0+6.2832/dashes*.55;a.push(Math.cos(t0)*rad,0,Math.sin(t0)*rad,Math.cos(t1)*rad,0,Math.sin(t1)*rad)}return mkLines(a,color,op)}
function buildHolo(){
  if(holo)rig.remove(holo);
  holo=new THREE.Group();rig.add(holo);PER=NL>48?30:36;
  const r=rng(21),N=NL*PER,P=new Float32Array(N*3),C=new Float32Array(N*3),lay=new Uint8Array(N),jit=new Float32Array(N),a0=new Float32Array(N),rad=new Float32Array(N);
  const hybrid=PAT.indexOf('L')>=0;
  for(let l=0;l<NL;l++){const rr=Rl(l,NL)*((hybrid&&PAT[l]==='L')?.9:1);for(let j=0;j<PER;j++){const i=l*PER+j;a0[i]=6.2832*j/PER+l*.11;rad[i]=rr;lay[i]=l;jit[i]=r()}}
  const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(P,3));pg.setAttribute('color',new THREE.BufferAttribute(C,3));
  holo.add(new THREE.Points(pg,new THREE.PointsMaterial({size:.055,vertexColors:true,transparent:true,blending:ADD,depthWrite:false,sizeAttenuation:true})));
  const A=[],B=[];const id=(l,j)=>l*PER+((j%PER)+PER)%PER;
  for(let l=0;l<NL;l++)for(let j=0;j<PER;j++){A.push(id(l,j));B.push(id(l,j+1));if(l<NL-1){A.push(id(l,j));B.push(id(l+1,j));A.push(id(l,j));B.push(id(l+1,j+1))}}
  const S=A.length,LP=new Float32Array(S*6),LC=new Float32Array(S*6);
  const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.BufferAttribute(LP,3));lg.setAttribute('color',new THREE.BufferAttribute(LC,3));
  holo.add(new THREE.LineSegments(lg,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,blending:ADD,depthWrite:false})));
  // 混合架构：全注意力层再加一圈亮环作"枢纽"，一眼分辨层的类型
  const hubs=[];if(hybrid)for(let l=0;l<NL;l++)if(PAT[l]==='A'){const h=dashedRing(Rl(l,NL)+.06,72,0xffd36a,.55);h.position.y=Yl(l,NL);holo.add(h);hubs.push(h)}
  // 悬浮微粒
  const D=420,DP=new Float32Array(D*3),DC=new Float32Array(D*3);
  for(let i=0;i<D;i++){const a=r()*6.2832,q=Math.sqrt(r())*.95;DP[i*3]=Math.cos(a)*q;DP[i*3+1]=-1.1+2.2*r();DP[i*3+2]=Math.sin(a)*q;DC[i*3]=.05;DC[i*3+1]=.28;DC[i*3+2]=.36}
  const dg=new THREE.BufferGeometry();dg.setAttribute('position',new THREE.BufferAttribute(DP,3));dg.setAttribute('color',new THREE.BufferAttribute(DC,3));
  holo.add(new THREE.Points(dg,new THREE.PointsMaterial({size:.02,vertexColors:true,transparent:true,blending:ADD,depthWrite:false})));
  // 底座：同心环 + 辐条 + 中轴光束
  [.75,1.0,1.25].forEach((q,k)=>{const pts=[];for(let i=0;i<96;i++){const t0=6.2832*i/96,t1=6.2832*(i+1)/96;pts.push(Math.cos(t0)*q,-1.22,Math.sin(t0)*q,Math.cos(t1)*q,-1.22,Math.sin(t1)*q)}
    holo.add(mkLines(pts,0x2fb8d8,.5-k*.12))});
  const sp=[];for(let i=0;i<16;i++){const t=6.2832*i/16;sp.push(Math.cos(t)*.6,-1.22,Math.sin(t)*.6,Math.cos(t)*1.3,-1.22,Math.sin(t)*1.3)}holo.add(mkLines(sp,0x2fb8d8,.25));

// 每条连线（层 l 的矩阵 a → 层 l+1 的矩阵 b）固定一个随机相位和强度系数

function drawNet(t,isDark){

  const dim=isDark?'rgba(120,140,170,':'rgba(70,90,120,';

    const e=Math.sqrt(act[l]*act[l+1]);

    }

}
